when:
  - event: tag

steps:
  publish-release:
    image: "cr.codefloe.com/docker.io/woodpeckerci/plugin-release:0.3.0"
    settings:
      api-key:
        from_secret: release-token
      draft: true
      title: v${CI_COMMIT_TAG}

  publish-docker:
    image: "codefloe.com/crow-plugins/docker-buildx:2.3.0"
    settings:
      repo: codefloe.com/buriedincode/bookshelf
      registry: codefloe.com
      platforms: linux/amd64,linux/arm64,linux/arm/v7
      auto_tag: true
      username: BuriedInCode
      password:
        from_secret: docker-token

  publish-package:
    commands:
      - gradle publishAllPublicationsToCodefloeRepository
    environment:
      PACKAGE_TOKEN:
        from_secret: package-token
    image: "cr.codefloe.com/docker.io/gradle:9.5.0-jdk25"
