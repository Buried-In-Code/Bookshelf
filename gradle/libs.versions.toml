[bundles]
exposed = ["exposed-core", "exposed-dao", "exposed-jdbc", "exposed-kotlin-datetime"]
jackson = ["jackson-databind", "jackson-kotlin"]
javalin = ["javalin-core", "javalin-jte"]
jte = ["jte-core", "jte-kotlin"]
log4j2 = ["log4j2-jcl", "log4j2-slf4j2"]
scrimage = ["scrimage-core", "scrimage-webp"]

[libraries]
exposed-core = {module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed"}
exposed-dao = {module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed"}
exposed-jdbc = {module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed"}
exposed-kotlin-datetime = {module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed"}
hoplite-core = {module = "com.sksamuel.hoplite:hoplite-core", version = "2.9.0"}
jackson-databind = {module = "tools.jackson.core:jackson-databind", version.ref = "jackson"}
jackson-kotlin = {module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson"}
javalin-core = {group = "io.javalin", name = "javalin", version.ref = "javalin"}
javalin-jte = {group = "io.javalin", name = "javalin-rendering-jte", version.ref = "javalin"}
jte-core = {module = "gg.jte:jte", version.ref = "jte"}
jte-kotlin = {module = "gg.jte:jte-kotlin", version.ref = "jte"}
junit-jupiter = {module = "org.junit.jupiter:junit-jupiter", version.ref = "junit"}
junit-platform-launcher = {module = "org.junit.platform:junit-platform-launcher", version.ref = "junit"}
kotlin-logging = {module = "io.github.oshai:kotlin-logging", version = "8.0.4"}
kotlinx-datetime = {module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.8.0-0.6.x-compat"}
kotlinx-serialization = {module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0"}
log4j2-jcl = {module = "org.apache.logging.log4j:log4j-jcl", version.ref = "log4j2"}
log4j2-slf4j2 = {module = "org.apache.logging.log4j:log4j-slf4j2-impl", version.ref = "log4j2"}
scrimage-core = {module = "com.sksamuel.scrimage:scrimage-core", version.ref = "scrimage"}
scrimage-webp = {module = "com.sksamuel.scrimage:scrimage-webp", version.ref = "scrimage"}
sqlite-jdbc = {module = "org.xerial:sqlite-jdbc", version = "3.53.1.0"}

[plugins]
jte = {id = "gg.jte.gradle", version.ref = "jte"}
kotlin-jvm = {id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
kotlinx-serialization = {id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
shadow = {id = "com.gradleup.shadow", version = "9.4.2"}
spotless = {id = "com.diffplug.spotless", version = "8.6.0"}
versions = {id = "com.github.ben-manes.versions", version = "0.54.0"}

[versions]
exposed = "1.3.0"
jackson = "3.1.3"
javalin = "7.2.2"
jte = "3.2.4"
junit = "6.1.0"
kotlin = "2.3.21"
log4j2 = "2.26.0"
scrimage = "4.5.5"
